  function renderSheet(){
    const el = $("sheet"), r = cur();
    if(!sheet || !r){ el.hidden = true; el.innerHTML = ""; return; }
    const s = sheet, h = r.holes[s.hi];
    const ready = s.on != null && s.putts != null && s.on >= 1;
    const sc = ready ? s.on + s.putts : 0;
    const label = s.mode === "out" ? (r.pos < 17 ? `確定して${orderOf(r.start)[r.pos + 1] + 1}番へ` : "確定してラウンド終了") : "確定";
    const chips = (k, a, b) => { let o = ""; for(let v = a; v <= b; v++) o += `<button class="chip" data-set="${k}" data-v="${v}" aria-pressed="${s[k] === v}">${v}</button>`; return o; };
    const stepper = k => `<div class="step"><button data-st="${k}" data-d="-1" aria-label="1つ減らす">−</button><output>${s[k] == null ? "–" : s[k]}</output><button data-st="${k}" data-d="1" aria-label="1つ増やす">＋</button></div>`;
    el.hidden = false;
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <div class="sh-top">${pin(s.hi, true)}<h3 id="shT">${s.mode === "out" ? "ホールアウト" : "入力・修正"}</h3>
        <div class="pars">PAR ${[3,4,5].map(p => `<button class="par" data-spar="${p}" aria-pressed="${h.par === p}">${p}</button>`).join("")}</div></div>
      <div class="pick"><div class="pick-h"><div><b>オン</b><small>グリーンに乗るまでの打数。罰打も含めます</small></div>${stepper("on")}</div><div class="chips">${chips("on", 1, 8)}</div></div>
      <div class="pick"><div class="pick-h"><div><b>パット</b><small>グリーン上で打った数</small></div>${stepper("putts")}</div><div class="chips">${chips("putts", 0, 4)}</div></div>
      <div class="pens2"><div class="pen2"><span class="lab"><i class="m o"></i>OB</span>${stepper("ob")}</div><div class="pen2"><span class="lab"><i class="m h"></i>池など</span>${stepper("pen")}</div></div>
      <div class="result">${ready
        ? `<span class="cell"><b class="mk ${markClass(sc, h.par)}">${sc}</b></span><span class="txt">${s.on}オン${s.putts}パット<b>${scoreName(sc, h.par)}</b></span>`
        : `<span class="txt">オンとパットの数を選んでください</span>`}</div>
      ${ready && s.putts === 0 && sc > 1 ? `<div class="warnline">0パット（チップイン）で合っていますか？</div>` : ""}
      ${(r.players || []).length ? `<div class="others"><b style="font-size:14px">同伴者</b>${r.players.map((nm, k) => `<div class="orow"><span>${esc(nm)}</span><div class="step"><button data-ost="${k}" data-d="-1" aria-label="${esc(nm)}の打数を減らす">−</button><output>${s.others[k] == null ? "–" : s.others[k]}</output><button data-ost="${k}" data-d="1" aria-label="${esc(nm)}の打数を増やす">＋</button></div></div>`).join("")}</div>` : ""}
      <p class="fine">OBと池の回数は、楽天に写すための記録です。</p>
      <div class="sh-act"><button class="btn" data-act="closesheet">戻る</button><button class="btn ink" data-act="confirm" ${ready ? "" : "disabled"}>${label}</button></div>
    </div>`;
  }
  function renderTransfer(){
    const el = $("xfer"), r = cur();
    if(!transfer || !r){ el.hidden = true; el.innerHTML = ""; return; }
    const ord = orderOf(r.start), i = Math.min(Math.max(r.tpos || 0, 0), 17), hi = ord[i], h = r.holes[hi], pl = played(h), sc = strokes(h);
    let seg = ""; for(let k = 0; k < 18; k++) seg += `<i class="${k <= i ? "on" : ""}"></i>`;
    el.hidden = false;
    el.innerHTML = `<div class="xin">
      <div class="xtop"><h2>楽天ゴルフスコアへ転記</h2><button class="close" data-act="closexfer" aria-label="閉じる">×</button></div>
      <p class="xnote">楽天のアプリで同じホールを開いて、この数字を写してください。アプリを行き来しても、どこまで写したかは覚えておきます。</p>
      <div class="xprog"><span>${i + 1}/18</span><div class="prog" aria-hidden="true">${seg}</div></div>
      <div class="xcard">
        <div class="xhead">${pin(hi, true)}<span class="pp">PAR ${h.par}</span></div>
        ${pl ? `<div class="xrow main"><span>打数<small>${scoreName(sc, h.par)}</small></span><b>${sc}</b></div>
          <div class="xrow"><span>パット</span><b>${h.putts}</b></div>
          <div class="xrow${h.ob ? "" : " zero"}"><span>OB</span><b>${h.ob}</b></div>
          <div class="xrow${h.pen ? "" : " zero"}"><span>池など</span><b>${h.pen}</b></div>
          ${(r.players || []).map((nm, k) => `<div class="xrow"><span>${esc(nm)}</span><b>${h.others && h.others[k] != null ? h.others[k] : "–"}</b></div>`).join("")}`
        : `<div class="xmiss">このホールはまだ入力されていません<button class="btn sm" data-edit="${hi}">入力する</button></div>`}
      </div>
      <div class="xnav"><button class="btn" data-act="xprev" ${i === 0 ? "disabled" : ""}>前のホール</button>
        ${i < 17 ? `<button class="btn ink" data-act="xnext">次のホール</button>` : `<button class="btn ink" data-act="xdone">転記済みにする</button>`}</div>
      ${i < 17 ? `<button class="linkish" data-act="xdone">途中でも、写し終えたら転記済みにする</button>` : ""}
    </div>`;
  }
  function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400); }

  // ---------- screen wake lock (optional) ----------
  async function reqWake(){
    try{ if(!("wakeLock" in navigator)) throw new Error("none"); wl = await navigator.wakeLock.request("screen"); }
    catch(e){ wakeOn = false; const c = $("wake"); if(c) c.checked = false; toast("この画面では使えませんでした"); }
  }

  // ---------- events ----------
  function onAct(a){
    const r = cur();
    switch(a){
      case "shot": case "putt": case "obRe": case "obFw": case "haz": count(a); break;
      case "undo": doUndo(); break;
      case "holeout": if(r) openSheet(holeIdx(r), "out"); break;
      case "confirm": confirmSheet(); break;
      case "closesheet": sheet = null; renderSheet(); break;
      case "newform": tab = "list"; showNew = true; render(); setTimeout(() => { const c = $("nfCourse"); if(c) c.focus(); }, 0); break;
      case "canceldel": confirmDel = null; render(); break;
      case "xfer": transfer = true; render(); break;
      case "closexfer": transfer = false; render(); break;
      case "xprev": if(r){ r.tpos = Math.max(0, (r.tpos || 0) - 1); touch(r); renderTransfer(); } break;
      case "xnext": if(r){ r.tpos = Math.min(17, (r.tpos || 0) + 1); touch(r); renderTransfer(); } break;
      case "xdone": if(r){ r.transferred = true; transfer = false; touch(r); render(); toast("転記済みにしました"); } break;
      case "untransfer": if(r){ r.transferred = false; touch(r); render(); } break;
      case "geo": openGeo(); break;
      case "closegeo": closeGeo(); break;
      case "shotstart": if(geo.me){ geo.from = geo.me; geo.pending = null; renderGeo(); toast("打ったら、ボールの位置まで歩いて「ボールの位置で記録」"); } break;
      case "shotend": if(geo.me && geo.from){ geo.pending = { to: geo.me, yards: yards(geo.from, geo.me) }; renderGeo(); } break;
      case "shotcancel": geo.from = null; geo.pending = null; renderGeo(); break;
      case "pendcancel": geo.pending = null; renderGeo(); break;
      case "reggreen": regGreen(); break;
      case "csv": exportCsv(); break;
      case "backup": exportBackup(); break;
      case "addplayer": addPlayer(); break;
      case "swclose": closeViewer(); break;
      case "swplay": swPlay(); break;
      case "swback": swStep(-1); break;
      case "swfwd": swStep(1); break;
      case "swdraw": sv.drawing = !sv.drawing; renderViewer(); break;
      case "swclear": sv.lines = []; drawOverlay(); break;
      case "swcompare": sv.picking = !sv.picking; renderViewer(); break;
      case "swuncompare": setB(null); break;
      case "swai": runAnalysis(); break;
      case "savevideo": saveVideo(); break;
    }
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if(!b){ if(e.target.id === "sheet"){ sheet = null; renderSheet(); } return; }
    const d = b.dataset;
    if(d.tab){ tab = d.tab; confirmDel = null; render(); return; }
    if(d.act){ onAct(d.act); return; }
    if(d.go !== undefined){ go(Number(d.go)); return; }
    if(d.par){ const r = cur(); if(r){ r.holes[holeIdx(r)].par = Number(d.par); touch(r); render(); } return; }
    if(d.spar){ const r = cur(); if(r && sheet){ r.holes[sheet.hi].par = Number(d.spar); touch(r); render(); } return; }
    if(d.set){ sheet[d.set] = Number(d.v); renderSheet(); return; }
    if(d.st){ step(d.st, Number(d.d)); return; }
    if(d.edit !== undefined){ openSheet(Number(d.edit), "edit"); return; }
    if(d.open){ curId = d.open; undo = []; saveLocal(); tab = rounds[curId].finished ? "card" : "play"; render(); return; }
    if(d.askdel){ confirmDel = d.askdel; render(); return; }
    if(d.del){ delete rounds[d.del]; addPending(d.del); if(curId === d.del) curId = pickCurrent(); confirmDel = null; saveLocal(); clearTimeout(timer); timer = setTimeout(flush, 300); render(); toast("削除しました"); return; }
    if(d.xfer){ curId = d.xfer; saveLocal(); transfer = true; render(); return; }
    if(d.club !== undefined){ saveShot(d.club || null); return; }
    if(d.ost !== undefined){ const k = Number(d.ost), dd = Number(d.d), r = cur(); if(sheet){ const v = sheet.others[k]; sheet.others[k] = v == null ? (dd > 0 ? r.holes[sheet.hi].par : null) : Math.max(1, Math.min(20, v + dd)); renderSheet(); } return; }
    if(d.delplayer !== undefined){ const r = cur(); if(r){ const k = Number(d.delplayer); r.players.splice(k, 1); r.holes.forEach(h => { if(h.others) h.others.splice(k, 1); }); touch(r); render(); } return; }
    if(d.practiced !== undefined){ extra.practice = extra.practice || []; extra.practice.unshift({ date: todayKey(), theme: d.practiced }); extra.practice = extra.practice.slice(0, 30); saveExtra(); render(); toast("練習を記録しました"); return; }
    if(d.vopen){ openViewer(d.vopen); return; }
    if(d.vdel){ idb.del(d.vdel).then(loadVideos); toast("動画を削除しました"); return; }
    if(d.vpick){ setB(d.vpick); return; }
    if(d.speed){ sv.speed = Number(d.speed); applySpeed(); renderViewer(); return; }
    if(d.key){ swSeekTo(Number(d.key)); return; }
    if(d.start){ nfStart = Number(d.start); document.querySelectorAll("[data-start]").forEach(x => x.setAttribute("aria-pressed", String(Number(x.dataset.start) === nfStart))); return; }
  });
  document.addEventListener("input", e => {
    if(e.target.id === "nfDate") nfDraft.date = e.target.value;
    if(e.target.id === "nfCourse") nfDraft.course = e.target.value;
  });
  document.addEventListener("submit", e => {
    if(e.target.id !== "nf") return;
    e.preventDefault();
    newRound($("nfDate").value || todayKey(), $("nfCourse").value.trim(), nfStart);
  });
  document.addEventListener("change", async e => {
    if(e.target.id !== "wake") return;
    wakeOn = e.target.checked;
    if(wakeOn) await reqWake(); else { try{ if(wl) await wl.release(); }catch(_){} wl = null; }
  });
  document.addEventListener("keydown", e => {
    if(e.key !== "Escape") return;
    if(sheet){ sheet = null; renderSheet(); } else if(transfer){ transfer = false; render(); }
  });
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ if(wakeOn) reqWake(); flush(); } });
  window.addEventListener("online", flush);

  // ---------- boot ----------
  // ---------- settings, registered greens, GPS ----------
  const XKEY = "golf-extra-v1";
  let extra = { competition: false, courses: {} };
  try{ const x = JSON.parse(localStorage.getItem(XKEY) || "null"); if(x) extra = Object.assign(extra, x); }catch(e){}
  const saveExtra = () => { try{ localStorage.setItem(XKEY, JSON.stringify(extra)); }catch(e){} };
  document.addEventListener("change", e => {
    if(e.target.id === "restoreFile" && e.target.files[0]) restoreBackup(e.target.files[0]);
    if(e.target.id === "vfile" && e.target.files[0]){ pendingVideo = e.target.files[0]; renderSwing(); }
  });
  document.addEventListener("input", e => { if(e.target.id === "swSeek" && sv.a){ swSeekTo(Number(e.target.value)); } });
  document.addEventListener("change", e => { if(e.target.id === "comp"){ extra.competition = e.target.checked; saveExtra(); toast(extra.competition ? "競技モード：距離を隠します" : "競技モードをオフにしました"); } });

  const CLUBS = ["1W","3W","5W","4U","5U","5I","6I","7I","8I","9I","PW","AW","SW"];
  const rad = x => x * Math.PI / 180;
  function meters(a, b){
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(h)));
  }
  const yards = (a, b) => Math.round(meters(a, b) / 0.9144);
  function clubHtml(){
    const by = {};
    Object.values(rounds).forEach(r => (r.shots || []).forEach(x => { if(x.club){ (by[x.club] = by[x.club] || []).push(x.yards); } }));
    const rows = CLUBS.filter(c => by[c]).map(c => { const ys = by[c]; const av = Math.round(ys.reduce((a,b)=>a+b,0)/ys.length);
      return `<div class="clubrow"><span class="cl">${c}</span><span class="av">${av}</span><span class="gsmall" style="flex:1">ヤード（平均）</span><span class="gsmall">最長 ${Math.max(...ys)}・${ys.length}回</span></div>`; });
    return rows.length ? `<div style="background:var(--paper);border:1.5px solid var(--graphite)">${rows.join("")}</div>` : `<div class="emptybox">プレー画面の「距離」で飛距離を記録すると、クラブごとの平均がここに出ます。</div>`;
  }

  const geo = { map: null, watch: null, me: null, acc: null, target: null, from: null, pending: null, layers: {}, centered: false, error: "" };
  const greenFor = () => { const r = cur(); if(!r || r.finished || !r.course) return null; const g = (extra.courses[r.course] || {})[holeIdx(r)]; return g || null; };
  function openGeo(){
    const r = cur();
    if(extra.competition){ toast("競技モード中は距離を表示しません"); return; }
    $("geo").hidden = false;
    geo.target = greenFor(); geo.from = null; geo.pending = null; geo.centered = false; geo.error = "";
    if(!window.L) geo.error = "地図を読み込めませんでした。電波のある場所で開き直してください（飛距離の記録は使えます）";
    else if(!geo.map){
      geo.map = L.map("map", { zoomControl: false, attributionControl: true }).setView([35.68, 139.76], 16);
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Tiles © Esri" }).addTo(geo.map);
      geo.map.on("click", e => { geo.target = { lat: e.latlng.lat, lng: e.latlng.lng }; geo.pending = null; drawGeo(); renderGeo(); });
    }
    if(geo.map){ setTimeout(() => geo.map.invalidateSize(), 50); if(geo.target) geo.map.setView([geo.target.lat, geo.target.lng], 17); }
    if(!("geolocation" in navigator)){ geo.error = "この端末では位置情報が使えません"; }
    else {
      geo.watch = navigator.geolocation.watchPosition(p => {
        geo.me = { lat: p.coords.latitude, lng: p.coords.longitude }; geo.acc = p.coords.accuracy; if(window.L) geo.error = "";
        if(geo.map && !geo.centered){ geo.centered = true; const pts = [[geo.me.lat, geo.me.lng]]; if(geo.target) pts.push([geo.target.lat, geo.target.lng]);
          pts.length > 1 ? geo.map.fitBounds(pts, { padding: [60, 60], maxZoom: 18 }) : geo.map.setView(pts[0], 17); }
        drawGeo(); renderGeo();
      }, err => { geo.error = err.code === 1 ? "位置情報が許可されていません。Safariの設定で、このページの位置情報を「許可」にしてください" : "現在地を取得できませんでした。空が見える場所で少し待ってください"; renderGeo(); },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    }
    $("geoHole").innerHTML = r && !r.finished ? `<b>${holeIdx(r) + 1}</b>番` : "";
    drawGeo(); renderGeo();
  }
  function closeGeo(){
    if(geo.watch != null){ navigator.geolocation.clearWatch(geo.watch); geo.watch = null; }
    $("geo").hidden = true; geo.me = null;
  }
  function drawGeo(){
    if(!geo.map) return;
    Object.values(geo.layers).forEach(l => l && geo.map.removeLayer(l)); geo.layers = {};
    if(geo.me) geo.layers.me = L.circleMarker([geo.me.lat, geo.me.lng], { radius: 8, color: "#fff", weight: 3, fillColor: "#2F7DF6", fillOpacity: 1 }).addTo(geo.map);
    if(geo.target) geo.layers.t = L.marker([geo.target.lat, geo.target.lng], { icon: L.divIcon({ className: "", html: '<div class="flagicon"><i></i><b></b></div>', iconSize: [22, 30], iconAnchor: [2, 30] }) }).addTo(geo.map);
    if(geo.me && geo.target) geo.layers.line = L.polyline([[geo.me.lat, geo.me.lng], [geo.target.lat, geo.target.lng]], { color: "#F5C400", weight: 3 }).addTo(geo.map);
    if(geo.from) geo.layers.from = L.circleMarker([geo.from.lat, geo.from.lng], { radius: 6, color: "#1E1F1B", weight: 3, fillColor: "#fff", fillOpacity: 1 }).addTo(geo.map);
    if(geo.from && geo.me) geo.layers.shot = L.polyline([[geo.from.lat, geo.from.lng], [geo.me.lat, geo.me.lng]], { color: "#fff", weight: 2, dashArray: "6 6" }).addTo(geo.map);
  }
  function renderGeo(){
    const el = $("geoPanel"); if($("geo").hidden) return;
    const r = cur(), playing = r && !r.finished, reg = greenFor();
    const onReg = reg && geo.target && reg.lat === geo.target.lat && reg.lng === geo.target.lng;
    if(geo.pending){
      el.innerHTML = `<b>${geo.pending.yards}ヤード。使ったクラブは？</b><div class="clubs">${CLUBS.map(c => `<button class="chip" data-club="${c}">${c}</button>`).join("")}</div>
        <div class="grow"><button class="btn" style="flex:1" data-club="">クラブなしで記録</button><button class="btn" style="flex:1" data-act="pendcancel">やめる</button></div>`;
      return;
    }
    let html = "";
    if(geo.error) html += `<div style="color:var(--amber);font-weight:700">${geo.error}</div>`;
    if(geo.me && geo.target){
      html += `<div class="readout"><b>${yards(geo.me, geo.target)}</b><div><div class="u">ヤード</div><div class="gsmall">${Math.round(meters(geo.me, geo.target))}m・${onReg ? "登録したグリーンまで" : "タップした地点まで"}</div></div></div>`;
    } else if(!geo.error){
      html += `<div class="gsmall" style="font-size:15px">${geo.me ? "地図をタップすると、そこまでの距離が出ます" : "現在地を探しています…"}</div>`;
    }
    if(geo.acc != null && geo.me) html += `<div class="gsmall">GPSの誤差 約±${Math.round(geo.acc)}m</div>`;
    if(geo.target && playing && r.course && !onReg) html += `<button class="btn sm" data-act="reggreen">この地点を${holeIdx(r) + 1}番のグリーンとして登録</button>`;
    if(!playing) html += `<div class="gsmall">飛距離の記録は、ラウンド中に使えます。</div>`;
    else if(geo.from){
      html += `<div class="grow"><div style="flex:1"><div class="gsmall">打った場所から</div><b style="font-family:var(--f-num);font-size:30px">${geo.me ? yards(geo.from, geo.me) : "–"}ヤード</b></div>
        <button class="btn ink" data-act="shotend" ${geo.me ? "" : "disabled"}>ボールの位置で記録</button><button class="btn sm" data-act="shotcancel">やめる</button></div>`;
    } else html += `<button class="btn" data-act="shotstart" ${geo.me ? "" : "disabled"}>ここから打つ（飛距離を測る）</button>`;
    el.innerHTML = html;
  }
  function regGreen(){
    const r = cur(); if(!r || !r.course || !geo.target) return;
    (extra.courses[r.course] = extra.courses[r.course] || {})[holeIdx(r)] = geo.target; saveExtra(); renderGeo();
    toast(`${holeIdx(r) + 1}番のグリーンとして登録しました。次回から自動で出ます`);
  }
  function saveShot(club){
    const r = cur(); if(!r || !geo.pending || !geo.from) return;
    r.shots = r.shots || [];
    r.shots.push({ id: "s" + Date.now().toString(36), hole: holeIdx(r), club, yards: geo.pending.yards, from: geo.from, to: geo.pending.to, at: Date.now() });
    touch(r); toast(`${club || "クラブなし"} ${geo.pending.yards}ヤードを記録しました`);
    geo.pending = null; geo.from = null; drawGeo(); renderGeo();
  }

  // ================= companions =================
  function playersHtml(r){
    const ps = r.players || [];
    let table = "";
    if(ps.length){
      const head = Array.from({ length: 18 }, (_, i) => `<th>${i + 1}</th>`).join("");
      const rows = ps.map((nm, k) => {
        let out = 0, inn = 0, no = 0, ni = 0;
        const cells = r.holes.map((h, i) => { const v = h.others && h.others[k]; if(v != null){ if(i < 9){ out += v; no++; } else { inn += v; ni++; } } return `<td>${v == null ? "" : v}</td>`; }).join("");
        return `<tr><td class="nm">${esc(nm)}</td>${cells}<td class="tot">${no ? out : ""}</td><td class="tot">${ni ? inn : ""}</td><td class="tot">${no + ni ? out + inn : ""}</td></tr>`;
      }).join("");
      table = `<div class="ptable"><table><tr><th></th>${head}<th>OUT</th><th>IN</th><th>計</th></tr>${rows}</table></div>`;
    }
    return `<section><h2 class="sec">同伴者のスコア</h2>
      ${table}
      <div class="pchips" style="margin-top:8px">${ps.map((nm, k) => `<span class="pchip">${esc(nm)}<button data-delplayer="${k}" aria-label="${esc(nm)}を外す">×</button></span>`).join("")}</div>
      ${ps.length < 3 ? `<div class="grow" style="margin-top:8px"><input class="pinput" id="pname" placeholder="同伴者の名前" style="flex:1" autocomplete="off"><button class="btn sm" data-act="addplayer">追加</button></div>` : ""}
      <p class="note" style="margin-top:6px">ホールアウトの画面で、同伴者の打数も一緒に入れられます（3人まで）。</p></section>`;
  }
  function addPlayer(){
    const r = cur(), el = $("pname"); if(!r || !el) return;
    const nm = el.value.trim(); if(!nm) return;
    r.players = r.players || []; if(r.players.length >= 3) return;
    r.players.push(nm); touch(r); render(); toast(`${nm}さんを追加しました`);
  }

  // ================= data export / backup =================
  function download(name, text, type){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  function exportCsv(){
    const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const maxP = Math.max(0, ...Object.values(rounds).map(r => (r.players || []).length));
    const head = ["日付","コース","ホール","パー","打数","パット","OB","池など"];
    for(let k = 0; k < maxP; k++) head.push(`同伴者${k + 1}`, `同伴者${k + 1}の打数`);
    const lines = [head.map(q).join(",")];
    Object.values(rounds).sort((a, b) => a.date.localeCompare(b.date)).forEach(r => r.holes.forEach((h, i) => {
      if(!played(h)) return;
      const row = [r.date, r.course, i + 1, h.par, strokes(h), h.putts, h.ob, h.pen];
      for(let k = 0; k < maxP; k++) row.push((r.players || [])[k] || "", h.others && h.others[k] != null ? h.others[k] : "");
      lines.push(row.map(q).join(","));
    }));
    download(`golf-scores-${todayKey()}.csv`, "﻿" + lines.join("\n"), "text/csv");
    toast("CSVを書き出しました");
  }
  function exportBackup(){
    download(`golf-backup-${todayKey()}.json`, JSON.stringify({ app: "golf-counter", version: 1, rounds, extra }, null, 1), "application/json");
    toast("バックアップを保存しました");
  }
  function restoreBackup(file){
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(fr.result);
        if(!d || typeof d.rounds !== "object") throw new Error("bad");
        let n = 0;
        Object.values(d.rounds).forEach(r => { if(r && r.id && Array.isArray(r.holes) && r.holes.length === 18){ const l = rounds[r.id]; if(!l || (r.updatedAt || 0) > (l.updatedAt || 0)){ rounds[r.id] = r; addPending(r.id); n++; } } });
        if(d.extra && typeof d.extra === "object"){ extra.courses = Object.assign({}, d.extra.courses || {}, extra.courses); extra.practice = (extra.practice || []).concat(d.extra.practice || []).slice(0, 30); saveExtra(); }
        if(!curId || !rounds[curId]) curId = pickCurrent();
        saveLocal(); clearTimeout(timer); timer = setTimeout(flush, 300); render();
        toast(`${n}ラウンドを戻しました`);
      }catch(e){ toast("このファイルは読み込めませんでした。バックアップのJSONを選んでください"); }
    };
    fr.readAsText(file);
  }

  // ================= analysis =================
  function stats(){
    const rs = Object.values(rounds);
    const full = rs.filter(r => r.holes.every(played)).sort((a, b) => a.date.localeCompare(b.date) || (a.createdAt||0) - (b.createdAt||0));
    let holes = 0, putts = 0, three = 0, gir = 0, ob = 0, pen = 0;
    const byPar = { 3: [0, 0], 4: [0, 0], 5: [0, 0] };
    rs.forEach(r => r.holes.forEach(h => {
      if(!h.done && !played(h)) return; if(!played(h)) return;
      holes++; putts += h.putts; if(h.putts >= 3) three++; if(h.on <= h.par - 2) gir++; ob += h.ob; pen += h.pen;
      if(byPar[h.par]){ byPar[h.par][0] += strokes(h) - h.par; byPar[h.par][1]++; }
    }));
    const scores = full.map(r => totals(r).s);
    return { full, holes, scores,
      avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null,
      best: scores.length ? Math.min(...scores) : null,
      puttsPerRound: holes ? putts / holes * 18 : null,
      threeRate: holes ? three / holes : null,
      girRate: holes ? gir / holes : null,
      obPerRound: holes ? ob / holes * 18 : null,
      penPerRound: holes ? pen / holes * 18 : null,
      byPar: Object.fromEntries(Object.entries(byPar).map(([p, [s, n]]) => [p, n ? s / n : null])) };
  }
  function suggestions(st){
    const t = [];
    if(st.holes < 9) return t;
    if(st.threeRate != null && (st.threeRate >= 0.12 || st.puttsPerRound >= 36)) t.push({ theme: "パター：距離感", why: `3パットが${Math.round(st.threeRate * 100)}%（1ラウンド平均${st.puttsPerRound.toFixed(1)}パット）。ロングパットを2パットで収める練習が効きます`, film: "パターのストロークを正面から。肩の高さでカメラを構える" });
    if(st.obPerRound != null && st.obPerRound >= 1) t.push({ theme: "ドライバー：方向性", why: `OBが1ラウンドあたり${st.obPerRound.toFixed(1)}回。飛距離より曲げないことを優先しましょう`, film: "ドライバーを後方（飛球線の後ろ）から。スイングの向きが分かります" });
    if(st.girRate != null && st.girRate < 0.2) t.push({ theme: "アイアン：グリーンに乗せる", why: `パーオン率が${Math.round(st.girRate * 100)}%。7番アイアンで狙った方向に運ぶ練習を`, film: "7番アイアンを正面から全身が入るように" });
    if(st.penPerRound != null && st.penPerRound >= 1) t.push({ theme: "コースマネジメント", why: `池などの罰打が1ラウンドあたり${st.penPerRound.toFixed(1)}回。無理に越えず、刻む判断を練習ラウンドで試しましょう`, film: "" });
    if(st.byPar[3] != null && st.byPar[3] >= 1.3) t.push({ theme: "ショートアイアンとアプローチ", why: `パー3の平均が+${st.byPar[3].toFixed(1)}。ティーショットの精度と寄せを練習しましょう`, film: "アプローチを正面から。体の揺れを確認" });
    if(st.byPar[5] != null && st.byPar[5] >= 1.6) t.push({ theme: "フェアウェイウッド・2打目", why: `パー5の平均が+${st.byPar[5].toFixed(1)}。2打目で無理をしないクラブ選びを`, film: "ウッドを後方から" });
    if(!t.length) t.push({ theme: "今の良い流れを保つ", why: "大きな弱点は見当たりません。スコアのばらつきを減らす基本練習を続けましょう", film: "ドライバーと7番アイアンを正面から、月に1回撮って比べる" });
    return t;
  }
  function trendSvg(full){
    const last = full.slice(-10); if(last.length < 2) return "";
    const vals = last.map(r => totals(r).s), lo = Math.min(...vals) - 3, hi = Math.max(...vals) + 3;
    const W = 340, H = 140, x = i => 24 + i * (W - 48) / (last.length - 1), y = v => 20 + (hi - v) / (hi - lo) * (H - 44);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === vals.length - 1 ? 5 : 3.5}" fill="${i === vals.length - 1 ? "var(--flag)" : "var(--graphite)"}" stroke="var(--graphite)" stroke-width="1"><title>${last[i].date} ${v}打</title></circle><text x="${x(i)}" y="${y(v) - 9}" text-anchor="middle" font-size="11" fill="var(--graphite)" font-family="var(--f-num)" font-weight="800">${v}</text>`).join("");
    const labels = last.map((r, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--muted)">${r.date.slice(5).replace("-", "/")}</text>`).join("");
    return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${last.length}ラウンドのスコア"><polyline points="${pts}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>${dots}${labels}</svg></div>`;
  }
  function renderStats(){
    const m = $("main"), st = stats();
    const f1 = v => v == null ? "—" : v.toFixed(1), pc = v => v == null ? "—" : Math.round(v * 100) + "%";
    const sg = v => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2);
    if(!st.holes){ m.innerHTML = `<div class="emptybox">ラウンドを記録すると、ここに平均スコアや弱点、次の練習テーマが出ます。</div>`; return; }
    const tips = suggestions(st), log = (extra.practice || []).slice(0, 5);
    m.innerHTML = `
      <div class="kpis">
        <div class="kpi"><span>平均スコア</span><b>${st.avg == null ? "—" : st.avg.toFixed(1)}</b><small>18ホール ${st.full.length}回</small></div>
        <div class="kpi"><span>ベスト</span><b>${st.best ?? "—"}</b><small>&nbsp;</small></div>
        <div class="kpi"><span>パット/ラウンド</span><b>${f1(st.puttsPerRound)}</b><small>3パット ${pc(st.threeRate)}</small></div>
        <div class="kpi"><span>パーオン率</span><b>${pc(st.girRate)}</b><small>${st.holes}ホールから</small></div>
        <div class="kpi"><span>OB/ラウンド</span><b>${f1(st.obPerRound)}</b><small>&nbsp;</small></div>
        <div class="kpi"><span>池など/ラウンド</span><b>${f1(st.penPerRound)}</b><small>&nbsp;</small></div>
      </div>
      <section><h2 class="sec">パー別の平均（パーとの差）</h2><div class="parrow">
        ${[3, 4, 5].map(p => `<div class="parbox"><span>パー${p}</span><b>${sg(st.byPar[p])}</b></div>`).join("")}</div></section>
      ${st.full.length >= 2 ? `<section><h2 class="sec">スコアの推移（直近10ラウンド）</h2>${trendSvg(st.full)}</section>` : ""}
      <section><h2 class="sec">次の練習テーマ</h2><div style="display:flex;flex-direction:column;gap:8px">
        ${tips.map(t => `<div class="tip"><b>${esc(t.theme)}</b><p>${esc(t.why)}</p>${t.film ? `<span class="film">撮ると良いスイング：${esc(t.film)}</span>` : ""}<button class="btn sm" style="align-self:flex-start" data-practiced="${esc(t.theme)}">今日これを練習した</button></div>`).join("")}
      </div>${log.length ? `<div class="plog" style="margin-top:8px"><b style="color:var(--graphite)">練習の記録</b>${log.map(l => `<span>${fmtDate(l.date)}　${esc(l.theme)}</span>`).join("")}</div>` : ""}</section>
      <section><h2 class="sec">クラブ別の飛距離</h2>${clubHtml()}</section>`;
  }

  // ================= swing videos (IndexedDB) =================
  const idb = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const q = indexedDB.open("golf-swing", 1);
      q.onupgradeneeded = () => q.result.createObjectStore("videos", { keyPath: "id" });
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
    const run = (mode, fn) => open().then(d => new Promise((res, rej) => {
      const t = d.transaction("videos", mode), req = fn(t.objectStore("videos"));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    }));
    return { all: () => run("readonly", s => s.getAll()), put: v => run("readwrite", s => s.put(v)), del: id => run("readwrite", s => s.delete(id)) };
  })();
  let videos = null, pendingVideo = null, videoErr = "";
  function loadVideos(){ idb.all().then(v => { videos = (v || []).sort((a, b) => b.at - a.at); if(tab === "swing") renderSwing(); }).catch(() => { videos = []; videoErr = "この画面では動画を保存できません（プライベートブラウズでは使えないことがあります）"; if(tab === "swing") renderSwing(); }); }
  function renderSwing(){
    const m = $("main");
    if(videos == null){ m.innerHTML = `<div class="emptybox">読み込み中…</div>`; loadVideos(); return; }
    const clubs = ["1W","3W","5W","UT","5I","6I","7I","8I","9I","PW","AW","SW","PT"];
    m.innerHTML = `
      <section class="panel"><div class="addv">
        <b>スイングを撮る・追加する</b>
        <label class="btn ink" style="text-align:center;cursor:pointer">${pendingVideo ? "別の動画を選ぶ" : "動画を撮る／選ぶ"}<input type="file" id="vfile" accept="video/*" hidden></label>
        ${pendingVideo ? `<span class="gsmall">${esc(pendingVideo.name || "動画")}（${(pendingVideo.size / 1048576).toFixed(1)}MB）</span>
          <div class="grow"><select id="vclub" aria-label="クラブ">${clubs.map(c => `<option>${c}</option>`).join("")}</select>
          <select id="vview" aria-label="撮った向き"><option value="face">正面から</option><option value="dtl">後方から</option></select></div>
          <input type="text" id="vnote" placeholder="メモ（例：練習場、右に曲がる）" autocomplete="off">
          <button class="btn ink" data-act="savevideo">保存する</button>` : `<span class="gsmall">全身が入るように、体の正面か後方から撮ってください。3〜6秒くらいの長さがおすすめです。</span>`}
      </div></section>
      ${videoErr ? `<div class="warnline">${esc(videoErr)}</div>` : ""}
      <section><h2 class="sec">保存したスイング</h2>
      ${videos.length ? `<ul class="vlist">${videos.map(v => `<li><button class="vo" data-vopen="${v.id}"><b>${esc(v.club)}　${v.view === "dtl" ? "後方" : "正面"}</b><span>${fmtDate(v.date)}${v.note ? "　" + esc(v.note) : ""}${v.analysis ? "　解析済み" : ""}</span></button><button class="btn sm" data-vdel="${v.id}">削除</button></li>`).join("")}</ul>`
        : `<div class="emptybox">まだ動画がありません。撮ったスイングは、このiPhoneの中にだけ保存されます。</div>`}
      </section>`;
  }
  function saveVideo(){
    if(!pendingVideo) return;
    const v = { id: "v" + Date.now().toString(36), at: Date.now(), date: todayKey(), club: $("vclub").value, view: $("vview").value, note: $("vnote").value.trim(), blob: pendingVideo, analysis: null };
    idb.put(v).then(() => { pendingVideo = null; toast("スイングを保存しました"); loadVideos(); })
      .catch(() => toast("保存できませんでした。容量が足りないか、この画面では保存できません"));
  }

  // ================= swing viewer =================
  const sv = { a: null, b: null, speed: 0.5, drawing: false, lines: [], picking: false, busy: "", raf: 0, drag: null };
  function paneHtml(key, v){
    return `<div class="pane" id="pane-${key}"><video id="vid-${key}" playsinline muted preload="auto"></video><canvas id="cv-${key}"></canvas><span class="tagv">${key === "a" ? "A" : "B"}　${esc(v.club)} ${fmtDate(v.date)}</span></div>`;
  }
  function openViewer(id){
    const v = videos.find(x => x.id === id); if(!v) return;
    closeViewer(true);
    sv.a = { v, url: URL.createObjectURL(v.blob) }; sv.b = null; sv.lines = []; sv.drawing = false; sv.picking = false; sv.busy = "";
    const el = $("swv"); el.hidden = false;
    el.innerHTML = `<div class="swtop"><button class="pill" data-act="swclose">閉じる</button><span id="swTitle"></span></div>
      <div class="stage" id="stage">${paneHtml("a", v)}</div><div class="swctl" id="swctl"></div>`;
    bindVideo("a"); renderViewer();
  }
  function bindVideo(key){
    const st = sv[key], vid = $("vid-" + key);
    vid.src = st.url; vid.playbackRate = sv.speed;
    vid.addEventListener("loadedmetadata", () => { sizeCanvas(key); if(key === "a") renderViewer(); drawOverlay(); });
    vid.addEventListener("seeked", drawOverlay);
    vid.addEventListener("pause", () => { cancelAnimationFrame(sv.raf); renderViewer(); });
    vid.addEventListener("play", () => { const loop = () => { drawOverlay(); syncSeek(); sv.raf = requestAnimationFrame(loop); }; loop(); renderViewer(); });
    if(key === "a"){
      const cv = $("cv-a");
      cv.addEventListener("pointerdown", e => { if(!sv.drawing) return; const p = rel(cv, e); sv.drag = { x1: p.x, y1: p.y, x2: p.x, y2: p.y }; cv.setPointerCapture(e.pointerId); });
      cv.addEventListener("pointermove", e => { if(!sv.drag) return; const p = rel(cv, e); sv.drag.x2 = p.x; sv.drag.y2 = p.y; drawOverlay(); });
      cv.addEventListener("pointerup", () => { if(sv.drag){ sv.lines.push(sv.drag); sv.drag = null; drawOverlay(); } });
    }
  }
  const rel = (cv, e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
  function sizeCanvas(key){
    const vid = $("vid-" + key), cv = $("cv-" + key); if(!vid || !cv) return;
    const r = vid.getBoundingClientRect(), pr = vid.parentElement.getBoundingClientRect();
    cv.style.left = (r.left - pr.left) + "px"; cv.style.top = (r.top - pr.top) + "px";
    cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
    cv.width = Math.round(r.width * devicePixelRatio); cv.height = Math.round(r.height * devicePixelRatio);
    cv.style.pointerEvents = key === "a" && sv.drawing ? "auto" : "none";
  }
  window.addEventListener("resize", () => { if(sv.a){ sizeCanvas("a"); if(sv.b) sizeCanvas("b"); drawOverlay(); } });
  const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
  function nearestFrame(an, t){ if(!an || !an.frames.length) return null; let best = an.frames[0]; for(const f of an.frames){ if(Math.abs(f.t - t) < Math.abs(best.t - t)) best = f; } return Math.abs(best.t - t) < 0.2 ? best : null; }
  function drawOverlay(){
    ["a", "b"].forEach(key => {
      const st = sv[key], cv = $("cv-" + key), vid = $("vid-" + key); if(!st || !cv || !vid) return;
      const g = cv.getContext("2d"), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
      const f = nearestFrame(st.v.analysis, vid.currentTime);
      if(f){
        g.lineWidth = 3 * devicePixelRatio; g.strokeStyle = "rgba(245,196,0,.9)"; g.fillStyle = "#fff";
        BONES.forEach(([i, j]) => { const p = f.lm[i], q = f.lm[j]; if(!p || !q) return; g.beginPath(); g.moveTo(p[0] * W, p[1] * H); g.lineTo(q[0] * W, q[1] * H); g.stroke(); });
        [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28].forEach(i => { const p = f.lm[i]; if(!p) return; g.beginPath(); g.arc(p[0] * W, p[1] * H, 3.5 * devicePixelRatio, 0, 7); g.fill(); });
      }
      if(key === "a"){
        g.strokeStyle = "#FF5A4E"; g.lineWidth = 3 * devicePixelRatio;
        [...sv.lines, ...(sv.drag ? [sv.drag] : [])].forEach(l => { g.beginPath(); g.moveTo(l.x1 * W, l.y1 * H); g.lineTo(l.x2 * W, l.y2 * H); g.stroke(); });
      }
    });
    const s = $("swSeek"), va = $("vid-a"); if(s && va && document.activeElement !== s) s.value = va.currentTime;
    const tl = $("swTime"); if(tl && va) tl.textContent = va.currentTime.toFixed(2) + "秒";
  }
  // B follows A, aligned on impact when both are analysed
  const offsetOf = st => st && st.v.analysis && st.v.analysis.impact != null ? st.v.analysis.impact : 0;
  function syncSeek(){
    if(!sv.b) return; const va = $("vid-a"), vb = $("vid-b"); if(!va || !vb) return;
    const t = va.currentTime - offsetOf(sv.a) + offsetOf(sv.b);
    if(Math.abs(vb.currentTime - t) > 0.08) vb.currentTime = Math.max(0, Math.min(vb.duration || 0, t));
  }
  function swSeekTo(t){ const va = $("vid-a"); if(!va) return; va.pause(); const vb = $("vid-b"); if(vb) vb.pause(); va.currentTime = Math.max(0, Math.min(va.duration || 0, t)); syncSeek(); }
  function swStep(d){ const va = $("vid-a"); if(va) swSeekTo(va.currentTime + d / 30); }
  function swPlay(){
    const va = $("vid-a"), vb = $("vid-b"); if(!va) return;
    if(va.paused){ if(va.ended || va.currentTime >= va.duration - 0.05) va.currentTime = 0; syncSeek(); va.play().catch(() => {}); if(vb) vb.play().catch(() => {}); }
    else { va.pause(); if(vb) vb.pause(); }
  }
  function applySpeed(){ ["a", "b"].forEach(k => { const v = $("vid-" + k); if(v) v.playbackRate = sv.speed; }); }
  function setB(id){
    const st = $("stage"); if(!st) return;
    if(sv.b){ URL.revokeObjectURL(sv.b.url); sv.b = null; const pb = $("pane-b"); if(pb) pb.remove(); }
    sv.picking = false;
    if(id){ const v = videos.find(x => x.id === id); if(v){ sv.b = { v, url: URL.createObjectURL(v.blob) }; st.insertAdjacentHTML("beforeend", paneHtml("b", v)); bindVideo("b"); } }
    setTimeout(() => { sizeCanvas("a"); if(sv.b) sizeCanvas("b"); syncSeek(); drawOverlay(); }, 60);
    renderViewer();
  }
  function renderViewer(){
    const el = $("swctl"); if(!el || !sv.a) return;
    const va = $("vid-a"), dur = va && va.duration ? va.duration : 0, an = sv.a.v.analysis;
    $("swTitle").textContent = `${sv.a.v.club}　${sv.a.v.view === "dtl" ? "後方" : "正面"}　${fmtDate(sv.a.v.date)}`;
    const others = (videos || []).filter(x => x.id !== sv.a.v.id);
    el.innerHTML = `
      ${sv.picking ? `<div class="swres"><b style="font-family:inherit;font-size:13px;color:#fff">比べる動画を選ぶ</b>${others.length ? others.map(o => `<button class="swb" style="text-align:left" data-vpick="${o.id}">${esc(o.club)} ${o.view === "dtl" ? "後方" : "正面"}　${fmtDate(o.date)}${o.note ? "　" + esc(o.note) : ""}</button>`).join("") : "<span>ほかの動画がありません</span>"}</div>` : ""}
      ${an ? analysisHtml(an) : ""}
      ${sv.busy ? `<div class="swres">${esc(sv.busy)}</div>` : ""}
      <input type="range" id="swSeek" min="0" max="${dur.toFixed(2)}" step="0.01" value="${va ? va.currentTime : 0}" aria-label="再生位置">
      <div class="swrow">
        <button class="swb" data-act="swback" aria-label="1コマ戻る">◀1コマ</button>
        <button class="swb" data-act="swplay" style="flex:1">${va && !va.paused ? "停止" : "再生"}</button>
        <button class="swb" data-act="swfwd" aria-label="1コマ進む">1コマ▶</button>
        <span id="swTime" style="font-size:12px;color:#C9CCC2;min-width:48px;text-align:right">0.00秒</span>
      </div>
      <div class="swrow">
        ${[0.25, 0.5, 1].map(x => `<button class="swb" data-speed="${x}" aria-pressed="${sv.speed === x}">×${x}</button>`).join("")}
        <button class="swb" data-act="swdraw" aria-pressed="${sv.drawing}">線を引く</button>
        <button class="swb" data-act="swclear">線を消す</button>
      </div>
      <div class="swrow">
        ${sv.b ? `<button class="swb" data-act="swuncompare">比較をやめる</button>` : `<button class="swb" data-act="swcompare" aria-pressed="${sv.picking}">別の動画と比べる</button>`}
        <button class="swb" data-act="swai" ${sv.busy ? "disabled" : ""} style="flex:1">${an ? "AIでもう一度解析" : "AIでスイング解析"}</button>
      </div>`;
    sizeCanvas("a"); if(sv.b) sizeCanvas("b"); drawOverlay();
  }
  function closeViewer(silent){
    cancelAnimationFrame(sv.raf);
    ["a", "b"].forEach(k => { if(sv[k]) URL.revokeObjectURL(sv[k].url); sv[k] = null; });
    const el = $("swv"); el.hidden = true; el.innerHTML = "";
  }

  // ================= AI swing analysis (runs on the phone, nothing is uploaded) =================
  const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";
  const MODEL = "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  let landmarkerP = null;
  function getLandmarker(){
    if(!landmarkerP) landmarkerP = (async () => {
      const mp = await import(MP + "/vision_bundle.mjs");
      const files = await mp.FilesetResolver.forVisionTasks(MP + "/wasm");
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: "VIDEO", numPoses: 1 });
      try{ return await mp.PoseLandmarker.createFromOptions(files, opts("GPU")); }
      catch(e){ return await mp.PoseLandmarker.createFromOptions(files, opts("CPU")); }
    })().catch(e => { landmarkerP = null; throw e; });
    return landmarkerP;
  }
  const seek = (v, t) => new Promise(res => { const done = () => { v.removeEventListener("seeked", done); res(); }; v.addEventListener("seeked", done); v.currentTime = t; });
  async function runAnalysis(){
    if(!sv.a || sv.busy) return;
    const target = sv.a;
    sv.busy = "AIの準備をしています…（初回は数十秒かかることがあります）"; renderViewer();
    let lmk;
    try{ lmk = await getLandmarker(); }
    catch(e){ sv.busy = ""; renderViewer(); toast("AIを読み込めませんでした。電波のある場所で、https のページから開いてください"); return; }
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = target.url;
    await new Promise(res => { v.onloadeddata = res; v.onerror = res; });
    const dur = v.duration || 0, step = Math.max(1 / 20, dur / 160), frames = [];
    try{
      for(let t = 0, k = 0; t <= dur; t += step, k++){
        await seek(v, Math.min(t, dur - 0.001));
        const r = lmk.detectForVideo(v, Math.round(t * 1000) + 1 + k);
        const lm = r && r.landmarks && r.landmarks[0];
        if(lm) frames.push({ t, lm: lm.map(p => [+p.x.toFixed(4), +p.y.toFixed(4), +(p.visibility || 0).toFixed(2)]) });
        if(k % 5 === 0){ sv.busy = `解析中… ${Math.min(100, Math.round(t / dur * 100))}%`; renderViewer(); }
        if(sv.a !== target) return;
      }
    }catch(e){ sv.busy = ""; renderViewer(); toast("解析の途中で止まりました。短い動画で試してください"); return; }
    const an = summarize(frames, v.videoWidth || 1, v.videoHeight || 1, target.v.view);
    target.v.analysis = an; idb.put(target.v).catch(() => {});
    sv.busy = ""; renderViewer();
    toast(an.ok ? "解析しました" : "体が見つからないコマが多く、うまく解析できませんでした");
  }
  // Find address / top / impact from the hands' height, then measure tempo, head movement and posture.
  function summarize(frames, W, H, view){
    const good = frames.filter(f => f.lm[15] && f.lm[16] && f.lm[15][2] > 0.3 && f.lm[16][2] > 0.3);
    if(good.length < 8) return { ok: false, frames };
    const hands = f => (f.lm[15][1] + f.lm[16][1]) / 2;
    let top = 0; good.forEach((f, i) => { if(hands(f) < hands(good[top])) top = i; });
    const base = good.slice(0, Math.min(4, top + 1)).map(hands).sort((a, b) => a - b)[0] ?? hands(good[0]);
    let start = good.findIndex((f, i) => i <= top && hands(f) < base - 0.04); if(start < 0) start = 0;
    const address = Math.max(0, start - 1);
    let impact = good.findIndex((f, i) => i > top && hands(f) >= hands(good[address]) - 0.03);
    if(impact < 0){ impact = top; good.forEach((f, i) => { if(i > top && hands(f) > hands(good[impact])) impact = i; }); }
    const A = good[address], T = good[top], I = good[impact];
    const mid = (f, i, j) => [(f.lm[i][0] + f.lm[j][0]) / 2 * W, (f.lm[i][1] + f.lm[j][1]) / 2 * H];
    const spine = f => { const s = mid(f, 11, 12), h = mid(f, 23, 24); return Math.atan2(Math.abs(s[0] - h[0]), h[1] - s[1]) * 180 / Math.PI; };
    const shoulderW = Math.abs(A.lm[11][0] - A.lm[12][0]) * W || 1;
    const headX = Math.abs(I.lm[0][0] - A.lm[0][0]) * W / shoulderW;
    const headY = (I.lm[0][1] - A.lm[0][1]) * H / shoulderW;
    const back = T.t - good[start].t, down = I.t - T.t;
    const tempo = down > 0 ? back / down : null;
    const spineA = spine(A), spineI = spine(I);
    const adv = [];
    if(tempo != null){
      if(tempo < 2) adv.push("切り返しが急ぎ気味です。トップで一瞬止まるつもりで。");
      else if(tempo > 4.2) adv.push("バックスイングがゆっくりです。一定のリズムで振り上げましょう。");
      else adv.push("バックスイングとダウンスイングのリズムは良い範囲です（目安は約3：1）。");
    }
    if(view !== "dtl"){
      adv.push(headX > 0.35 ? "インパクトまでに頭が左右に大きく動いています。頭の位置を保つ意識を。" : "頭の左右の動きは小さく、安定しています。");
    } else {
      adv.push(spineA - spineI > 8 ? "インパクトで前傾が起き上がっています。お尻の位置を保ったまま振り抜きましょう。" : "前傾の角度はインパクトまで保てています。");
    }
    if(headY < -0.25) adv.push("インパクトで体が伸び上がっています。");
    return { ok: true, frames, address: A.t, top: T.t, impact: I.t, tempo, headX, spineA, spineI, advice: adv };
  }
  function analysisHtml(an){
    if(!an.ok) return `<div class="swres">体を見つけられませんでした。全身が画面に入り、背景と服の色がはっきり違う場所で撮ると解析しやすくなります。</div>`;
    return `<div class="swres">
      <div class="swrow"><button class="swb" data-key="${an.address}">アドレス</button><button class="swb" data-key="${an.top}">トップ</button><button class="swb" data-key="${an.impact}">インパクト</button></div>
      <span>テンポ（バック：ダウン）<b>${an.tempo ? an.tempo.toFixed(1) + "：1" : "—"}</b>　ダウンスイング <b>${(an.impact - an.top).toFixed(2)}</b>秒</span>
      <span>頭の左右の動き <b>${Math.round(an.headX * 100)}%</b>（肩幅に対して）　前傾 <b>${Math.round(an.spineA)}°→${Math.round(an.spineI)}°</b></span>
      ${an.advice.map(a => `<span class="adv">・${esc(a)}</span>`).join("")}
      <span style="color:#9A9E92;font-size:11px">スマホの動画からの目安です。撮る向きや距離で数値は変わります。</span>
    </div>`;
  }

  loadLocal();
  if(!curId || !rounds[curId]) curId = pickCurrent();
  render();
  setSync("local");
  connect();
})();
</script>

</body></html>
